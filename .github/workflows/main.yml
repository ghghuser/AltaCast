name: Build AltaCast Standalone

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Patch sources for modern toolchain
        working-directory: trunk/AltaCast/src
        shell: pwsh
        run: |
          $latin1 = [Text.Encoding]::GetEncoding(28591)
          function Edit-File($path, $pattern, $replacement) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $utf16 = ($bytes.Length -ge 2) -and ($bytes[0] -eq 0xFF) -and ($bytes[1] -eq 0xFE)
            $enc = if ($utf16) { [Text.Encoding]::Unicode } else { $latin1 }
            $text = $enc.GetString($bytes)
            $new = [regex]::Replace($text, $pattern, $replacement)
            if ($new -ne $text) {
              [IO.File]::WriteAllBytes($path, $enc.GetBytes($new))
              Write-Host "patched $path"
            }
          }

          # 1. WINVER / _WIN32_WINNT を 0x0A00 に
          foreach ($f in Get-ChildItem -File -Include *.h,*.vcxproj -Path .\*) {
            Edit-File $f.FullName '(WINVER|_WIN32_WINNT)(=|\s+)0x0[0-5][0-9A-Fa-f]{2}' '${1}${2}0x0A00'
          }

          # 3. "Built on : "__DATE__ のスペース不足を直す
          foreach ($f in Get-ChildItem -File -Include *.cpp -Path .\*) {
            Edit-File $f.FullName '"(__DATE__|__TIME__)' '" ${1}'
          }

          # 2. SAFESEH を無効化（プロジェクト側の指定を直接書き換える）
          $proj = (Resolve-Path altacastStandalone.vcxproj).Path
          Edit-File $proj '\s*<ImageHasSafeExceptionHandlers>[^<]*</ImageHasSafeExceptionHandlers>' ''
          Edit-File $proj '<Link>' '<Link><ImageHasSafeExceptionHandlers>false</ImageHasSafeExceptionHandlers>'
          Select-String -Path $proj -Pattern 'SafeExceptionHandlers' | Select-Object -First 10 | ForEach-Object { $_.Line }

          # 5. 録音ファイル名を「[YYYYMMDD] タイトル_hhmmss」にする
          $pat =
